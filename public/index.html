<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Make Profile Card</h2>
    <form action="/create" method="POST">
      <label>Name</label>
      <input type="text" name="name" placeholder="Enter your name" required>

      <label>Bio</label>
      <textarea name="bio" rows="3" placeholder="Write something about yourself" required></textarea>

      <label>Skills</label>
      <input type="text" name="skills" placeholder="HTML, CSS, JS" required>

      <label>Social Link</label>
      <input type="url" name="link" placeholder="https://github.com/yourname" required>

      <button type="submit">Create Card</button>
    </form>
  </div>
</body>
</html>
